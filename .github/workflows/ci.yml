name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: backend100k
        options: >-
          --health-cmd "pg_isready -U admin -d backend100k"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password
      DB_NAME: backend100k
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run migrate:up

      - run: npm run lint

      - run: npm run format:check

      - run: npm test

      - run: npm run build

      - name: Build Docker image
        run: docker build --build-arg APP_VERSION=${{ github.sha }} -t codeforge:${{ github.sha }} .

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag codeforge:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag codeforge:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest

      - name: Set up SSH for deploy
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Run database migrations on server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_USER: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          DB_NAME: ${{ secrets.PROD_DB_NAME }}
        run: |
          ssh -f -N -i ~/.ssh/deploy_key -L 5433:127.0.0.1:5432 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          sleep 2
          npm run migrate:up
          pkill -f "5433:127.0.0.1:5432" || true

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/app
            docker compose pull api
            docker compose up -d api
            docker logout ghcr.io

            for i in $(seq 1 15); do
              health=$(docker inspect --format="{{.State.Health.Status}}" app-api-1)
              echo "health check attempt $i: $health"
              if [ "$health" = "healthy" ]; then
                docker image prune -f || true
                exit 0
              fi
              if [ "$health" = "unhealthy" ]; then
                echo "DEPLOY FAILED: container reported unhealthy" >&2
                docker logs app-api-1 --tail 30 >&2
                exit 1
              fi
              sleep 4
            done

            echo "DEPLOY FAILED: timed out waiting for healthy status" >&2
            docker logs app-api-1 --tail 30 >&2
            exit 1
          '

      - name: Push image to GHCR (staging)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag codeforge:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker tag codeforge:${{ github.sha }} ghcr.io/${{ github.repository }}:dev
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:dev

      - name: Run database migrations on server (staging)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_USER: ${{ secrets.STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}
        run: |
          ssh -f -N -i ~/.ssh/deploy_key -L 5433:127.0.0.1:5432 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          sleep 2
          npm run migrate:up
          pkill -f "5433:127.0.0.1:5432" || true

      - name: Deploy to server (staging)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/app
            docker compose pull api-staging
            docker compose up -d api-staging
            docker logout ghcr.io

            for i in $(seq 1 15); do
              health=$(docker inspect --format="{{.State.Health.Status}}" app-api-staging-1)
              echo "health check attempt $i: $health"
              if [ "$health" = "healthy" ]; then
                docker image prune -f || true
                exit 0
              fi
              if [ "$health" = "unhealthy" ]; then
                echo "STAGING DEPLOY FAILED: container reported unhealthy" >&2
                docker logs app-api-staging-1 --tail 30 >&2
                exit 1
              fi
              sleep 4
            done

            echo "STAGING DEPLOY FAILED: timed out waiting for healthy status" >&2
            docker logs app-api-staging-1 --tail 30 >&2
            exit 1
          '
